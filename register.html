<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Face API -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>

<body>

<div class="page-container">

    <div class="login-card register-card">

        <div class="logo">🎓</div>

        <h1>Create Account</h1>
        <p class="subtitle">Register as a student</p>

        <form id="registerForm">

            <div class="input-group">
                <label for="registerName">Full Name</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter full name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerRegNo">Register Number</label>
                <input
                    type="text"
                    id="registerRegNo"
                    placeholder="Enter register number"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerEmail">Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerPassword">Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerCourse">Course / Department</label>

                <select id="registerCourse" required>
                    <option value="">Select course</option>
                    <option value="BSc Computer Science">
                        BSc Computer Science
                    </option>
                    <option value="BCA">
                        BCA
                    </option>
                    <option value="BCom">
                        BCom
                    </option>
                    <option value="BA">
                        BA
                    </option>
                    <option value="Other">
                        Other
                    </option>
                </select>
            </div>

            <div class="input-group">
                <label for="registerYear">Year</label>

                <select id="registerYear" required>
                    <option value="">Select year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>
            </div>

            <!-- Face Enrollment -->
            <div class="face-section">

                <h3>📷 Face Enrollment</h3>

                <p class="small-text">
                    Your face will be used only for attendance verification.
                </p>

                <video
                    id="registerVideo"
                    class="camera-video"
                    autoplay
                    muted
                    playsinline
                ></video>

                <canvas
                    id="registerCanvas"
                    style="display:none;"
                ></canvas>

                <button
                    type="button"
                    id="startRegisterCamera"
                    class="secondary-btn"
                >
                    Open Camera
                </button>

                <button
                    type="button"
                    id="captureFace"
                    class="secondary-btn"
                    style="display:none;"
                >
                    Capture Face
                </button>

                <p id="faceMessage" class="message"></p>

            </div>

            <button
                type="submit"
                id="registerButton"
                class="primary-btn"
            >
                Create Account
            </button>

            <p id="registerMessage" class="message"></p>

        </form>

        <div class="register-link">
            Already have an account?
            <a href="index.html">Login</a>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
